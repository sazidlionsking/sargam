name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code download
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Build native.js
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply Sargam icon and colors
        run: |
          cp -r icon/mipmap-* android/app/src/main/res/
          cp icon/values/*.xml android/app/src/main/res/values/
          find android/app/src/main/res -name 'splash.png' -exec cp icon/splash.png {} \;

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Sargam.apk

      - name: Save APK in Actions
        uses: actions/upload-artifact@v4
        with:
          name: Sargam-apk
          path: Sargam.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sargam (latest)
          files: Sargam.apk
